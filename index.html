<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeni Shop - Musiri Boutique</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
:root{--pink:#e91e63;--light:#fff0f5}
body{background:var(--light);color:#333}
header{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;color:var(--pink)} .logo small{font-size:11px;color:#555;display:block}
.cart-btn{background:var(--pink);color:#fff;border:0;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.hero{background:linear-gradient(135deg,#e91e63,#ff80ab);color:#fff;text-align:center;padding:20px 15px}
.hero h1{font-size:26px} .hero p{font-size:13px;margin-top:5px;opacity:.9}
.products{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:800px;margin:0 auto}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:.2s}
.card:active{transform:scale(.98)}
.card img{width:100%;height:280px;object-fit:cover;object-position:top}
.info{padding:10px}
.info h3{font-size:14px;height:34px;overflow:hidden}
.price{margin:6px 0;display:flex;gap:8px;align-items:center}
.new{font-weight:900;color:var(--pink)} .old{font-size:12px;color:#999;text-decoration:line-through}
.add{width:100%;background:#111;color:#fff;border:0;padding:10px;border-radius:10px;font-weight:bold;cursor:pointer}
.add.added{background:var(--pink)}
footer{background:#111;color:#888;text-align:center;padding:15px;font-size:12px;margin-top:20px}
/* Cart Drawer */
#cart{position:fixed;right:-100%;top:0;width:85%;max-width:380px;height:100%;
