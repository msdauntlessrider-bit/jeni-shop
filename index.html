<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeni Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff5f8}
header{background:#e91e63;color:#fff;padding:15px;text-align:center}
.banner{background:linear-gradient(135deg,#e91e63,#ff8a65);color:#fff;padding:25px;text-align:center}
.btn{background:#fff;color:#e91e63;padding:10px 20px;border-radius:20px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:10px}
.products{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.price{color:#e91e63;font-weight:bold;margin-top:5px}
button{background:#e91e63;color:#fff;border:none;padding:7px;width:100%;border-radius:15px;margin-top:6px}
footer{background:#222;color:#aaa;text-align:center;padding:15px;margin-top:15px;font-size:12px}
</style>
</head>
<body>
<header><h1>Jeni Shop</h1><p>Musiri</p></header>
<div class="banner"><h2>Trending Collections</h2><a class="btn" href="https://wa.me/919999999999">WhatsApp Order</a></div>
<div class="products">
<div class="card"><img src="https://via.placeholder.com/300?text=Saree"><h3>Saree</h3><div class="price">₹850</div><button>Order</button></div>
<div class="card"><img src="https://via.placeholder.com/300?text=Chudi"><h3>Chudithar</h3><div class="price">₹650</div><button>Order</button></div>
<div class="card"><img src="https://via.placeholder.com/300?text=Kurti"><h3>Kurti</h3><div class="price">₹450</div><button>Order</button></div>
<div class="card"><img src="https://via.placeholder.com/300?text=Cosmetics"><h3>Combo</h3><div class="price">₹299</div><button>Order</button></div>
</div>
<footer>Jeni Shop Musiri © 2026</footer>
</body>
</html>
